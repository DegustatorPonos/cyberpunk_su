services:
  postgres:
    image: postgres:latest
    container_name: cyber2020pg
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: cyber2020
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d cyber2020"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: cp2020_back
    container_name: cyber2020backend
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: cp2020_front
    container_name: cyber2020frontend
    ports:
      - "9000:8080"

volumes:
  postgres_data:
